name: conloca
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/ttsc prepare --tsconfig tsconfig.typia.json; find node_modules/.cache/ttsc/plugins -maxdepth 3 || true; cat node_modules/.cache/ttsc/plugins/*.lock.v2/*/owner.json 2>/dev/null
      - run: |
          node --report-on-signal --report-signal=SIGUSR2 --report-directory=/tmp/rep ./node_modules/astro/bin/astro.mjs build &
          P=$!; sleep 40; ps -ef --forest | grep -v "ps -ef" | grep -A8 astro.mjs | cut -c1-250; kill -USR2 $P; sleep 3
          node -e 'const f=require("fs");const d="/tmp/rep";for(const n of f.readdirSync(d)){const r=JSON.parse(f.readFileSync(d+"/"+n));console.log(r.javascriptStack.stack.join("\n"));console.log(JSON.stringify(r.libuv.filter(h=>h.is_active).map(h=>[h.type,h.address,h.remoteEndpoint,h.localEndpoint,h.pid,h.signum].filter(Boolean)),null,0));}'
          find node_modules/.cache/ttsc/plugins -maxdepth 3 -newer package.json || true
          wait $P
